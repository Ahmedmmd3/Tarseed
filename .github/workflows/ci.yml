name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-server-clean-typecheck:
    name: API server clean typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify protected branch check names
        run: pnpm run verify:ci-check-names

      - name: Verify API test schema initialization
        run: pnpm run verify:api-test-schema-init

      - name: Test CI check-name parser
        run: pnpm --filter @workspace/scripts test

      # This command removes all generated DB and API declarations before
      # rebuilding them through the API server's typecheck lifecycle.
      - name: Typecheck API server from clean DB outputs
        run: pnpm run typecheck:api-server:clean

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend artifacts
        run: pnpm run typecheck:frontend

  web-end-to-end-tests:
    name: Web end-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tarseed_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tarseed_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tarseed_e2e
      SESSION_SECRET: ci-e2e-session-secret-at-least-32-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test journal source draft linking
        run: pnpm --filter @workspace/api-server run test:accounting-routes

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run web end-to-end tests
        run: pnpm --filter @workspace/wudooh run test:e2e

  web-pwa-tests:
    name: Web PWA tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run production PWA tests
        run: pnpm --filter @workspace/wudooh run test:e2e:pwa

  mobile-native-e2e:
    name: Mobile native E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The Android emulator reaches the host process through 10.0.2.2.
      # This must stay a local fixture URL; never replace it with a deployed API.
      EXPO_PUBLIC_API_ORIGIN: http://10.0.2.2:4317
      MAESTRO_OUTPUT_DIR: ${{ github.workspace }}/artifacts/wudooh-mobile/e2e/results
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Generate Android test project
        working-directory: artifacts/wudooh-mobile
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build Android test APK
        working-directory: artifacts/wudooh-mobile
        run: ./android/gradlew --no-daemon :app:assembleRelease

      - name: Run native mobile E2E suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r artifacts/wudooh-mobile/android/app/build/outputs/apk/release/app-release.apk
            pnpm --filter @workspace/wudooh-mobile run test:e2e:native

      - name: Upload Maestro results and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-native-e2e-results
          path: artifacts/wudooh-mobile/e2e/results
          if-no-files-found: warn
          retention-days: 14

  security-hardening-tests:
    name: Security hardening tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tarseed_security
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tarseed_security"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tarseed_security
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify API test schema initialization
        run: pnpm run verify:api-test-schema-init

      - name: Run security hardening suite
        run: pnpm run test:security

  advisory-matrix-typecheck:
    name: Matrix typecheck (${{ matrix.target }} / Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        target: [api, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck selected target
        run: |
          if [ "${{ matrix.target }}" = "api" ]; then
            pnpm run typecheck:api-server:clean
          else
            pnpm run typecheck:frontend
          fi
