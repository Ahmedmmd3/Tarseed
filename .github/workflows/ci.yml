name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-server-clean-typecheck:
    name: API server clean typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify protected branch check names
        run: pnpm run verify:ci-check-names

      - name: Verify API test schema initialization
        run: pnpm run verify:api-test-schema-init

      - name: Test CI check-name parser
        run: pnpm --filter @workspace/scripts test

      # This command removes all generated DB and API declarations before
      # rebuilding them through the API server's typecheck lifecycle.
      - name: Typecheck API server from clean DB outputs
        run: pnpm run typecheck:api-server:clean

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend artifacts
        run: pnpm run typecheck:frontend

  advisory-matrix-typecheck:
    name: Matrix typecheck (${{ matrix.target }} / Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        target: [api, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck selected target
        run: |
          if [ "${{ matrix.target }}" = "api" ]; then
            pnpm run typecheck:api-server:clean
          else
            pnpm run typecheck:frontend
          fi
