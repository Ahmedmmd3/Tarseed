name: Verify branch protection

on:
  branch_protection_rule:
    types: [created, edited, deleted]
  repository_ruleset:
    types: [created, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-branch-protection
  cancel-in-progress: false

jobs:
  verify:
    name: Verify main branch protection
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # A manual dispatch can select another ref. The protection baseline and
          # alert lifecycle must always be evaluated from the default branch.
          ref: ${{ github.event.repository.default_branch }}

      # Configure these GitHub Actions secrets with a GitHub App that has
      # Administration: read access to this repository:
      # - BRANCH_PROTECTION_APP_ID
      # - BRANCH_PROTECTION_APP_PRIVATE_KEY
      - name: Create branch-protection reader token
        id: branch-protection-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BRANCH_PROTECTION_APP_ID }}
          private-key: ${{ secrets.BRANCH_PROTECTION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compare live main branch protection
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          pnpm run verify:branch-protection 2>&1 |
            tee "$RUNNER_TEMP/branch-protection-verification.log"
          exit_code=${PIPESTATUS[0]}

          {
            echo "message<<BRANCH_PROTECTION_VERIFICATION"
            cat "$RUNNER_TEMP/branch-protection-verification.log"
            echo "BRANCH_PROTECTION_VERIFICATION"
          } >> "$GITHUB_OUTPUT"

          exit "$exit_code"
        env:
          GITHUB_TOKEN: ${{ steps.branch-protection-token.outputs.token }}

      - name: Synchronize branch-protection drift alert
        id: synchronize-alert
        continue-on-error: true
        if: ${{ steps.verify.outcome == 'failure' }}
        uses: actions/github-script@v7
        env:
          BRANCH_PROTECTION_FAILURE: ${{ steps.verify.outputs.message }}
        with:
          script: |
            const issueTitle = "Branch protection drift detected for main";
            const verificationOutput =
              process.env.BRANCH_PROTECTION_FAILURE?.trim() ||
              "The verification command failed without producing diagnostic output.";
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const issueBody = [
              "## Main branch protection drift",
              "",
              "The branch-protection verification found a mismatch.",
              "The required check names and the protection baseline must be updated together.",
              "",
              "### Verification details",
              "",
              "```text",
              verificationOutput,
              "```",
              "",
              "### How to fix",
              "",
              "Update the GitHub branch protection and `.github/branch-protection-required-checks.json` together, then rerun the verification workflow.",
              "",
              `Workflow run: ${runUrl}`,
            ].join("\n");

            const describeError = (error) =>
              error instanceof Error ? error.message : String(error);
            const failSynchronization = (operation, error) => {
              const message =
                `Branch-protection alert synchronization failed while ${operation}: ` +
                describeError(error);
              core.error(message);
              throw new Error(message);
            };

            let openIssues;
            try {
              openIssues = await github.paginate(
                github.rest.issues.listForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: "open",
                  per_page: 100,
                },
              );
            } catch (error) {
              failSynchronization("reading open alert issues", error);
            }
            const existingIssue = openIssues.find(
              (issue) => !issue.pull_request && issue.title === issueTitle,
            );

            if (existingIssue) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  body: issueBody,
                });
              } catch (error) {
                failSynchronization(
                  `updating existing alert issue #${existingIssue.number}`,
                  error,
                );
              }
              core.notice(`Updated existing alert issue #${existingIssue.number}.`);
            } else {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issueTitle,
                  body: issueBody,
                }));
              } catch (error) {
                failSynchronization("creating the alert issue", error);
              }
              core.notice(`Created alert issue #${issue.number}.`);
            }

      - name: Report branch-protection alert synchronization failure
        if: ${{ always() && steps.synchronize-alert.outcome == 'failure' }}
        run: |
          echo "::error title=Branch-protection alert synchronization failed::The drift alert could not be read, created, or updated. Check the previous step for the GitHub API error."
          exit 1

      - name: Close resolved branch-protection alert
        id: close-alert
        continue-on-error: true
        if: ${{ steps.verify.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = "Branch protection drift detected for main";
            const describeError = (error) =>
              error instanceof Error ? error.message : String(error);
            const failSynchronization = (operation, error) => {
              const message =
                `Branch-protection alert synchronization failed while ${operation}: ` +
                describeError(error);
              core.error(message);
              throw new Error(message);
            };

            let openIssues;
            try {
              openIssues = await github.paginate(
                github.rest.issues.listForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: "open",
                  per_page: 100,
                },
              );
            } catch (error) {
              failSynchronization("reading open alert issues", error);
            }
            const existingIssue = openIssues.find(
              (issue) => !issue.pull_request && issue.title === issueTitle,
            );

            if (existingIssue) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  state: "closed",
                });
              } catch (error) {
                failSynchronization(
                  `closing resolved alert issue #${existingIssue.number}`,
                  error,
                );
              }
              core.notice(`Closed resolved alert issue #${existingIssue.number}.`);
            }

      - name: Report resolved branch-protection alert synchronization failure
        if: ${{ always() && steps.close-alert.outcome == 'failure' }}
        run: |
          echo "::error title=Resolved branch-protection alert synchronization failed::The resolved drift alert could not be read or closed. Check the previous step for the GitHub API error."
          exit 1

      - name: Fail when branch-protection verification does not match
        if: ${{ steps.verify.outcome == 'failure' }}
        run: exit 1
