kind = "web"
previewPath = "/"
title = "وضوح — نظام الكاشير والمحاسبة"
description = "تطبيق ويب محاسبة وكاشير متكامل باسم وضوح. يعمل offline-first مع IndexedDB عبر Dexie.js. يشمل نقطة بيع، إدارة منتجات، فواتير، مصاريف، عملاء، وتقارير. واجهة عربية RTL كاملة."
version = "1.0.0"
id = "artifacts/wudooh"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25935

[services.development]
run = "pnpm --filter @workspace/wudooh run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wudooh", "run", "build" ]
serve = "static"
publicDir = "artifacts/wudooh/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25935"
BASE_PATH = "/"
