      id: po-share-expiry-item-42
    timeout: 15000
- tapOn: "الكاشير"
- assertVisible:
    id: pos-screen
- tapOn: "المبيعات"
- assertVisible:
    id: sales-screen
- tapOn: "المخزون"
- assertVisible:
    id: inventory-screen
- tapOn: "المصاريف"
