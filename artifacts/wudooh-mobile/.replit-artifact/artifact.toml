kind = "mobile"
previewPath = "/wudooh-mobile/"
title = "ترصيد — تطبيق المتاجر"
description = "تطبيق جوال أصلي لأصحاب المتاجر لإدارة لوحة التحكم ونقطة البيع والمبيعات والمخزون والمصاريف، مع صلاحيات المنشأة والعمل دون شبكة ومزامنة آمنة."
version = "1.0.0"
id = "artifacts/wudooh-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/wudooh-mobile/" ]
localPort = 21760

[services.development]
run = "pnpm --filter @workspace/wudooh-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wudooh-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/wudooh-mobile", "run", "serve" ]

[services.env]
PORT = "21760"
BASE_PATH = "/wudooh-mobile/"
